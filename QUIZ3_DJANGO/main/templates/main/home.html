<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 82, 164, 0.15);
            border: 1px solid #cfe2f3;
        }

        h1 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 8px;
        }

        th {
            background-color: #007bff;
            color: white;
            padding: 14px;
            border: 1px solid #0069d9;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #d6e9ff;
            text-align: center;
            color: #333;
        }

        tr:nth-child(even) {
            background-color: #f0f7ff;
        }

        tr:hover {
            background-color: #dbeeff;
        }

        .empty {
            text-align: center;
            color: #4a6b8a;
            padding: 20px;
            background-color: #f0f7ff;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student List</h1>

        {% if students %}
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Course</th>
                    </tr>
                </thead>

                <tbody>
                    {% for student in students %}
                        <tr>
                            <td>{{ student.name }}</td>
                            <td>{{ student.age }}</td>
                            <td>{{ student.course }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>

        {% else %}
            <p class="empty">No students found.</p>
        {% endif %}

    </div>

</body>
</html>
